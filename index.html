<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#193b35"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="말씀 연구실"><link rel="manifest" href="manifest.webmanifest"><title>말씀 설교 연구실 · 모바일</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#1b2a26;background:#f5f6f1}*{box-sizing:border-box}body{margin:0}header{background:#193b35;color:white;padding:18px max(16px,env(safe-area-inset-left));position:sticky;top:0;z-index:2}header h1{font-size:1.18rem;margin:0}header small{opacity:.8}main{max-width:950px;margin:auto;padding:16px}button,.file{border:1px solid #9aaca6;border-radius:10px;background:white;color:#193b35;padding:11px 13px;font-size:15px;cursor:pointer}button:focus-visible{outline:3px solid #d0a452}button.primary,.file{background:#193b35;color:white}input[type=file]{display:none}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}.panel{background:white;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 2px 12px #193b3510}.muted{color:#61716a}.sermon{font-size:var(--font,23px);line-height:1.85;white-space:normal;overflow-wrap:anywhere}.bible-box{background:#f1f7f3;border:1px solid #bfd3c8;border-radius:12px;padding:18px;margin:20px 0}.bible-box h2{margin:0 0 10px!important}.bible-body{white-space:pre-wrap;line-height:1.9}.bible-box.collapsed .bible-body{display:none}.bible-action{margin-top:12px}.sermon h2{font-size:1.05em;border-bottom:1px solid #e1e8e3;margin-top:1.7em}.sermon p{white-space:pre-wrap}.sermon mark{border-radius:3px;padding:0 2px}.reader{position:fixed;z-index:5;bottom:env(safe-area-inset-bottom);right:10px;left:10px;background:#193b35;color:white;border-radius:14px 14px 0 0;box-shadow:0 -4px 22px #0004;padding:12px;max-width:540px;margin-left:auto}.reader button{font-size:14px;padding:9px}.reader .bar{display:flex;justify-content:space-between;align-items:center;gap:8px}.reader .controls{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}.reader select{font-size:15px;padding:8px;max-width:100%}.reader.folded .controls{display:none}.status{font-size:13px;min-height:1.4em}body.present header,body.present .import-panel{display:none}body.present main{max-width:100%;padding:12px}body.present .sermon{max-width:950px;margin:auto}body.present .panel{box-shadow:none}body.present{background:white}@media(min-width:850px){main{padding:25px}.reader{left:auto;min-width:360px}}@media print{header,.toolbar,.reader,.import-panel{display:none!important}main{padding:0}.panel{box-shadow:none}.sermon{font-size:18px}}
</style></head><body><header><h1>말씀 설교 연구실 <small>iPhone · iPad</small></h1></header><main><section class="panel import-panel"><strong>개인용 설교 원고</strong><p class="muted">PC에서 내려받은 원고 JSON을 가져오세요. 성경 본문이 포함된 PC 원고 JSON을 가져오면 강단에서도 본문을 볼 수 있습니다. 원고는 이 기기에만 저장되며 자동 동기화는 아직 지원하지 않습니다.</p><div class="toolbar"><label class="file">원고 JSON 가져오기<input id="file" type="file" accept=".json,application/json"></label><button id="export">현재 원고 내보내기</button><button id="clear">기기 저장 원고 삭제</button></div><div class="status" id="status" role="status"></div></section><div class="toolbar"><button id="smaller">글자 −</button><button id="larger">글자 +</button><button id="present">강단 전체화면</button><button id="readerToggle">낭독기 켜기</button><button onclick="window.print()">인쇄</button></div><article class="panel sermon" id="sermon"><h1>원고를 가져와 주세요</h1><p>PC의 말씀 설교 연구실에서 원고 작성 → JSON 백업을 선택한 뒤, 이 화면에서 파일을 가져오면 됩니다.</p></article></main><div class="reader" id="reader" hidden><div class="bar"><strong>설교문 낭독기</strong><div><button id="fold">− 접기</button><button id="close">닫기</button></div></div><div class="controls"><button id="play">▶ 읽기</button><button id="pause">Ⅱ 일시정지</button><button id="stop">■ 정지</button><label>속도 <select id="speed"><option value="0.8">0.8배</option><option value="1" selected>1배</option><option value="1.2">1.2배</option><option value="1.4">1.4배</option></select></label><label>목소리 <select id="voice"><option value="">기본 한국어 음성</option></select></label></div><div class="status" id="ttsStatus" aria-live="polite"></div></div><script>
'use strict';const $=id=>document.getElementById(id);const KEY='sermon-mobile-companion-v1';let doc=null,font=23,utter=null;const partNames={intro:'서론',body1:'첫 번째 말씀',body2:'두 번째 말씀',body3:'세 번째 말씀',conclusion:'결론',prayer:'기도',opening:'서론',point1:'첫 번째 말씀',point2:'두 번째 말씀',point3:'세 번째 말씀',closing:'결론'};
function textOnly(s){return String(s??'').replace(/==\{#[0-9a-f]{6}\}/gi,'').replace(/\*\*/g,'').replace(/==/g,'');}
function appendFormatted(parent,s){s=String(s??'');let i=0,bold=false,mark=null,segment='';function flush(){if(!segment)return;let node=document.createTextNode(segment);if(bold){const b=document.createElement('strong');b.append(node);node=b;}if(mark){const m=document.createElement('mark');m.style.backgroundColor=mark;m.append(node);node=m;}parent.append(node);segment='';}while(i<s.length){if(s.startsWith('**',i)){flush();bold=!bold;i+=2;continue;}const c=s.slice(i).match(/^==\{(#[0-9a-f]{6})\}/i);if(c){flush();mark=c[1];i+=c[0].length;continue;}if(s.startsWith('==',i)){flush();mark=mark?null:'#fff18b';i+=2;continue;}segment+=s[i++];}flush();}
function getSections(d){if(Array.isArray(d.structure)){return d.structure.filter(x=>x&&typeof x.id==='string').map(x=>({title:x.title||x.label||partNames[x.id]||x.id,text:d[x.id]||''})).filter(x=>x.text);}const keys=['intro','body1','body2','body3','conclusion','prayer','opening','point1','point2','point3','closing'];return keys.filter(k=>typeof d[k]==='string'&&d[k].trim()).map(k=>({title:partNames[k],text:d[k]}));}
function getPassage(d){for(const k of ['passage','bibleText','scriptureText','scripture','biblePassage']){if(typeof d[k]==='string'&&d[k].trim())return d[k].trim();}return '';}
function makeBibleBox(d){const passage=getPassage(d);if(!passage)return null;const box=document.createElement('section');box.className='bible-box';box.id='bibleBox';const heading=document.createElement('h2');heading.textContent='성경 본문';const ref=document.createElement('div');ref.className='muted';ref.textContent=[d.reference,d.bibleTranslation].filter(Boolean).join(' · ');const body=document.createElement('div');body.className='bible-body';body.id='bibleBody';body.textContent=passage;const button=document.createElement('button');button.className='primary bible-action';button.type='button';button.textContent='본문 접기 · 설교 시작';button.setAttribute('aria-expanded','true');button.onclick=()=>{const folded=box.classList.toggle('collapsed');button.textContent=folded?'성경 본문 펼치기':'본문 접기 · 설교 시작';button.setAttribute('aria-expanded',String(!folded));if(folded){const first=box.nextElementSibling;if(first)first.scrollIntoView({behavior:'smooth',block:'start'});}else{box.scrollIntoView({behavior:'smooth',block:'start'});}};box.append(heading,ref,body,button);return box;}
function render(){const root=$('sermon');root.replaceChildren();if(!doc)return;const h=document.createElement('h1');h.textContent=doc.title||'제목 없는 설교';root.append(h);const meta=document.createElement('div');meta.className='muted';meta.textContent=[doc.reference,doc.date].filter(Boolean).join(' · ');root.append(meta);const bible=makeBibleBox(doc);if(bible)root.append(bible);for(const section of getSections(doc)){const h2=document.createElement('h2');h2.textContent=section.title;const p=document.createElement('p');appendFormatted(p,section.text);root.append(h2,p);}if(!getSections(doc).length){const p=document.createElement('p');p.textContent='이 원고에 표시할 본문이 없습니다.';root.append(p);}}
function setStatus(s){$('status').textContent=s;}function persist(){try{localStorage.setItem(KEY,JSON.stringify(doc));}catch{setStatus('기기 저장 공간이 부족합니다. JSON으로 내보내어 보관하세요.');}}
function validate(d){if(!d||typeof d!=='object'||Array.isArray(d))throw Error('설교 원고 형식이 아닙니다.');if(!Object.keys(d).some(k=>typeof d[k]==='string'&&['title','intro','body1','body2','body3','conclusion','opening','point1','point2','point3','closing'].includes(k)))throw Error('설교문 항목을 찾지 못했습니다.');return d;}
$('file').onchange=async e=>{const f=e.target.files?.[0];e.target.value='';if(!f)return;try{if(f.size>2_000_000)throw Error('2MB 이하 JSON 파일만 가져올 수 있습니다.');const parsed=JSON.parse(await f.text());const next=validate(parsed.document||parsed.current||parsed);doc=next;persist();render();setStatus('원고를 이 기기에 저장했습니다.');}catch(err){setStatus('가져오기 실패: '+err.message);}};
$('export').onclick=()=>{if(!doc)return setStatus('먼저 원고를 가져오세요.');const url=URL.createObjectURL(new Blob([JSON.stringify(doc,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='설교원고-'+(doc.title||'백업').replace(/[\/:*?"<>|]/g,'_')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
$('clear').onclick=()=>{if(!confirm('이 기기에 저장한 원고를 삭제하시겠습니까?'))return;localStorage.removeItem(KEY);doc=null;render();$('sermon').textContent='저장된 원고가 없습니다.';setStatus('기기 저장 원고를 삭제했습니다.');stop();};
function resize(n){font=Math.max(16,Math.min(44,font+n));document.documentElement.style.setProperty('--font',font+'px');localStorage.setItem('sermon-mobile-font',font);} $('smaller').onclick=()=>resize(-2);$('larger').onclick=()=>resize(2);$('present').onclick=()=>{document.body.classList.toggle('present');$('present').textContent=document.body.classList.contains('present')?'일반 화면':'강단 전체화면';};
function stop(){if('speechSynthesis'in window)window.speechSynthesis.cancel();utter=null;$('ttsStatus').textContent='';}function voices(){if(!('speechSynthesis'in window))return;const vs=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('ko'));const select=$('voice'),prev=select.value;select.replaceChildren(new Option('기본 한국어 음성',''));vs.forEach(v=>select.add(new Option(v.name,v.voiceURI)));select.value=prev;}
if('speechSynthesis'in window){speechSynthesis.onvoiceschanged=voices;voices();}
$('readerToggle').onclick=()=>{$('reader').hidden=false;$('reader').classList.remove('folded');};$('close').onclick=()=>{stop();$('reader').hidden=true;};$('fold').onclick=()=>{const f=$('reader').classList.toggle('folded');$('fold').textContent=f?'▢ 펼치기':'− 접기';};
$('play').onclick=()=>{if(!('speechSynthesis'in window))return $('ttsStatus').textContent='이 브라우저에서 음성 낭독을 지원하지 않습니다.';if(!doc)return $('ttsStatus').textContent='원고를 먼저 가져오세요.';stop();const text=getSections(doc).map(s=>textOnly(s.text)).join('\n\n');if(!text.trim())return;$('ttsStatus').textContent='낭독 중…';utter=new SpeechSynthesisUtterance(text);utter.lang='ko-KR';utter.rate=Number($('speed').value);const v=speechSynthesis.getVoices().find(v=>v.voiceURI===$('voice').value);if(v)utter.voice=v;utter.onend=()=>$('ttsStatus').textContent='낭독 완료';utter.onerror=()=>$('ttsStatus').textContent='낭독이 중단되었습니다.';speechSynthesis.speak(utter);};$('pause').onclick=()=>{if(!('speechSynthesis'in window))return;if(speechSynthesis.paused){speechSynthesis.resume();$('pause').textContent='Ⅱ 일시정지';}else{speechSynthesis.pause();$('pause').textContent='▶ 이어 읽기';}};$('stop').onclick=stop;
try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x){doc=validate(x);render();setStatus('이 기기에 저장된 원고를 불러왔습니다.');}}catch{}font=Number(localStorage.getItem('sermon-mobile-font')||23);document.documentElement.style.setProperty('--font',font+'px');if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
